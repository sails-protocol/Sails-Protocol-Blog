name: Validate Blog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify editorial WebP assets exist and fit budgets
        run: node scripts/check-editorial-image-assets.mjs
      - name: Verify article catalogue matches source
        run: npm run check:articles
      - name: Verify WebMCP static contract
        run: node scripts/verify-webmcp.mjs
      - name: Execute WebMCP tool tests
        run: node scripts/test-webmcp-execution.mjs
      - name: Verify WebMCP registration and rollback
        run: node scripts/test-webmcp-registration.mjs
      - name: Verify Netlify security configuration
        run: node scripts/verify-netlify-config.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://sails-protocol-blog.netlify.app
      - name: Verify generated routes and assets
        run: node scripts/verify-build.mjs
      - name: Build Portuguese locale
        run: npm run build -- --locale pt-BR
        env:
          SITE_URL: https://sails-protocol-blog.netlify.app
      - name: Build Spanish locale
        run: npm run build -- --locale es
        env:
          SITE_URL: https://sails-protocol-blog.netlify.app
      - name: Verify all locale outputs and draft isolation
        run: node scripts/verify-build.mjs --require-all-locales
